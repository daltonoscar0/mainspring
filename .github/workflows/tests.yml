name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # Everything except transformers and torch. Those are only needed for
      # real DistilBART standfirsts, are lazily imported in
      # mainspring/summarize.py, and are ~700 MB for torch alone. The test
      # suite does not touch them: 246 tests pass without them.
      - name: Install
        run: |
          grep -vE '^(transformers|torch)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt

      # pytest.ini puts the repo root on sys.path, so no install step is needed.
      # The feed and page fixtures under tests/fixtures/ mean no network access.
      - name: Run tests
        run: pytest
