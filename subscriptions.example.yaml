# Mainspring subscriptions, example
#
# Copy this to subscriptions.yaml and put your own publications in it:
#
#     cp subscriptions.example.yaml subscriptions.yaml
#
# subscriptions.yaml is gitignored, because the list of what you read is exactly
# the sort of thing this project exists to keep to yourself. Mainspring falls
# back to this example file if you have not made one yet, so a fresh clone builds
# a real edition immediately.
#
# Fields
#   name          Display name. Appears in bylines and standing heads.
#   slug          URL-safe id. Becomes publications/<slug>.html, so changing it
#                 breaks existing links. Pick once.
#   feed_url      RSS endpoint. For a Substack this is <host>/feed, that works
#                 for custom domains (www.example.com/feed) as well as
#                 example.substack.com/feed. Non-Substack feeds work too.
#   tier          free  ingested over RSS. Works today.
#                 paid  ingested from the publication's email, which already
#                       contains the full post. Milestone 2; skipped for now.
#   kind          newsletter  an individual writer, filing occasionally. Default.
#                 wire        a news outlet, filing all day.
#                 The front page carries a separate river for each, with its own
#                 reserved slots, pooled, the wire takes every slot and a
#                 newsletter from three days ago never appears.
#   fetch_pages   Optional, default true. false means never fetch the post page,
#                 even when the feed carries only an excerpt. Use it when a
#                 publisher's page layout defeats the cleaner but their feed is
#                 clean, or simply to avoid crawling someone.
#   homepage_url  Optional. Defaults to feed_url with /feed removed.
#
# Check a publication before you add it, one can look perfectly healthy in a
# browser and still produce nothing here:
#
#     python scripts/check_feeds.py <url-or-domain-or-handle>
#     python scripts/check_feeds.py --configured    # re-check this whole file
#
# The six below are free publications that post regularly, so a fresh install has
# a full front page on day one. Every one was verified with check_feeds.py.

publications:
  - name: Astral Codex Ten
    slug: astral-codex-ten
    feed_url: https://www.astralcodexten.com/feed
    tier: free

  - name: Construction Physics
    slug: construction-physics
    feed_url: https://www.construction-physics.com/feed
    tier: free

  - name: Noahpinion
    slug: noahpinion
    feed_url: https://www.noahpinion.blog/feed
    tier: free

  - name: The Honest Broker
    slug: the-honest-broker
    feed_url: https://www.honest-broker.com/feed
    tier: free

  - name: Experimental History
    slug: experimental-history
    feed_url: https://www.experimental-history.com/feed
    tier: free

  - name: Silver Bulletin
    slug: silver-bulletin
    feed_url: https://www.natesilver.net/feed
    tier: free

  # ------------------------------------------------------------------------
  # The other three field combinations, for reference. Uncomment and edit.
  # ------------------------------------------------------------------------

  # A news outlet. Files many times a day, so it belongs in the wire river
  # rather than pooled with the newsletters.
  #
  # - name: Jacobin
  #   slug: jacobin
  #   feed_url: https://jacobin.com/feed
  #   tier: free
  #   kind: wire

  # A publisher whose feed is clean but whose article pages defeat the cleaner -
  # Democracy Now wraps its transcripts in sidebars of guests, topics and links.
  # Its feed summaries are better copy, so never fetch the page.
  #
  # - name: Democracy Now
  #   slug: democracy-now
  #   feed_url: https://www.democracynow.org/democracynow.rss
  #   tier: free
  #   kind: wire
  #   fetch_pages: false

  # A paid publication. Its feed carries only a teaser, so the RSS ingester skips
  # it; the email ingester in Milestone 2 will pick it up. Declared here so it
  # still appears in the publications directory.
  #
  # - name: A Paid Publication
  #   slug: a-paid-publication
  #   feed_url: https://paid.substack.com/feed
  #   tier: paid
