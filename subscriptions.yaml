# Mainspring subscriptions
#
# The publications your edition is built from. This file is the only place
# Mainspring learns what you read; nothing is discovered, recommended, or
# phoned home about.
#
# Fields
#   name          Display name. Appears in bylines and section rules.
#   slug          URL-safe id. Becomes publications/<slug>.html, so changing it
#                 breaks existing links. Pick once.
#   feed_url      RSS endpoint. For a Substack this is <host>/feed — that works
#                 for custom domains (www.example.com/feed) as well as
#                 example.substack.com/feed.
#   tier          free  ingested over RSS. Works today.
#                 paid  ingested from the publication's email, which already
#                       contains the full post. Milestone 2; skipped for now.
#   homepage_url  Optional. Defaults to feed_url with /feed removed.
#
# Verify a publication before adding it — a Substack can look healthy in a
# browser and still produce nothing here:
#
#     python scripts/check_feeds.py <url-or-domain-or-handle>
#     python scripts/check_feeds.py --configured    # re-check this whole file
#
# Every entry below was checked with that and carries full post text.

publications:
