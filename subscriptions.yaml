    feed_url: https://thewednesdayword.substack.com/feed
    tier: free
    homepage_url: https://www.thewednesdayword.com

  - name: Chelsea's Voice
    slug: chelseas-voice
    feed_url: https://chelseasvoice.substack.com/feed
    tier: free

  # --- Rugby --------------------------------------------------------------
  - name: 8/9 Rugby
    slug: eight-nine-rugby
    feed_url: https://89rugby.substack.com/feed
    tier: free

  # --- Markets ------------------------------------------------------------
  - name: Citrini Research
    slug: citrini-research
    feed_url: https://citrini.substack.com/feed
    tier: free
    homepage_url: https://www.citriniresearch.com

  - name: Cassandra Unchained
    slug: cassandra-unchained
    feed_url: https://michaeljburry.substack.com/feed
